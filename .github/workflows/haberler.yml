name: haberler

# Günlük haber toplama — yerel bilgisayardan bağımsız, GitHub sunucusunda çalışır.
# Zamanlama kapalı: az haber üretme sorunu çözülünce yeniden açılacak (schedule / cron: "0 4 * * *" = 07:00 Türkiye).
on:
  workflow_dispatch: {} # Actions sekmesinden "Run workflow" ile elle de çalıştırılabilir

permissions:
  contents: write # üretilen .js dosyalarını depoya geri yazmak için

concurrency:
  group: haberler
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Groq model listesi (geçici, yalnızca adlar)
        continue-on-error: true
        env:
          K: ${{ secrets.GORQ_API_KEY }}
        run: |
          curl -s -H "Authorization: Bearer $K" https://api.groq.com/openai/v1/models \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log("GROQ_MODELLER: "+JSON.parse(s).data.map(m=>m.id).sort().join(" | "))}catch(e){console.log("GROQ_LISTE_HATA: "+s.slice(0,200))}})'

      - name: Haberleri topla ve dosyaları yaz
        env:
          MODEL_TOKEN: ${{ secrets.GORQ_API_KEY }} # yoksa model çağrılmaz, ham başlıklar yazılır
          MODEL_URL: https://api.groq.com/openai/v1/chat/completions # GitHub Models 30 Temmuz 2026'da kapandı
          MODEL: openai/gpt-oss-120b
        run: node otomasyon/haberler.mjs

      - name: Değişiklikleri yayınla
        run: |
          git config user.name "haberler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add haberler
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "haberler: günlük özet ($(date -u +%F))"
          git push
